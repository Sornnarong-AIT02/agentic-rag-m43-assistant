<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M43 Video Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; padding: 20px; }
    .chat-container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .chat-header { padding: 16px 20px; background: #334155; border-bottom: 1px solid #475569; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .chat-header h2 { font-size: 1.2rem; color: #38bdf8; }
    .camera-wrap { display: flex; align-items: center; gap: 8px; }
    .camera-wrap label { font-size: 0.85rem; color: #cbd5e1; }
    .camera-select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .message.user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .input-area { padding: 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .input-area input { flex: 1; background: #1e293b; border: 1px solid #475569; padding: 12px; border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
    .input-area input:focus { border-color: #38bdf8; }
    .input-area button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .input-area button:hover { background: #0369a1; }
    .input-area button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>📷 M43 Video Assistant</h2>
      <div class="camera-wrap">
        <label for="cameraSelect">กล้อง</label>
        <select id="cameraSelect" class="camera-select">
          <option value="">เลือกกล้อง (ตัวเลือกเสริม)</option>
          <option value="GM1">Panasonic Lumix GM1</option>
          <option value="GH5">Panasonic Lumix GH5</option>
          <option value="GH6">Panasonic Lumix GH6</option>
          <option value="G9">Panasonic Lumix G9</option>
          <option value="G100">Panasonic Lumix G100</option>
          <option value="OM-1">OM System OM-1</option>
          <option value="OM-5">OM System OM-5</option>
          <option value="EM10-IV">Olympus E-M10 IV</option>
          <option value="EM1-III">Olympus E-M1 III</option>
          <option value="BMPCC4K">BMPCC 4K</option>
        </select>
      </div>
    </div>

    <div id="chatBox" class="chat-box">
      <div class="message assistant">สวัสดีครับ! ผมคือผู้ช่วยตั้งค่ากล้องวิดีโอ M43 ถามข้อมูลคู่มือ เลนส์ หรือเทคนิคการตั้งค่าได้เลยครับ 👋</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="พิมพ์คำถามที่นี่..." autocomplete="off">
      <button id="sendBtn">ส่งคำถาม</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("userInput");
    const cameraSelect = document.getElementById("cameraSelect");
    const chatBox = document.getElementById("chatBox");
    const sendBtn = document.getElementById("sendBtn");

    let currentController = null;

    sendBtn.addEventListener("click", sendMessage);

    // ไม่ส่งตอนกำลังเลือกคำด้วย IME (ภาษาไทย/ญี่ปุ่น/จีน)
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    // ยกเลิก stream ถ้าผู้ใช้ปิด/รีโหลดหน้า
    window.addEventListener("beforeunload", () => {
      if (currentController) currentController.abort();
    });

    async function sendMessage() {
      // กัน Enter รัวๆ ยิงซ้อนกันตอนปุ่มถูก disable
      if (sendBtn.disabled) return;

      const text = input.value.trim();
      if (!text) return;

      // 1. แสดงกล่องข้อความของผู้ใช้
      const userMsgDiv = document.createElement("div");
      userMsgDiv.className = "message user";
      userMsgDiv.textContent = text;
      chatBox.appendChild(userMsgDiv);

      input.value = "";
      sendBtn.disabled = true;

      // 2. สร้างกล่องข้อความว่างสำหรับ Assistant เพื่อรอรับ SSE Stream
      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "message assistant";
      botMsgDiv.textContent = "กำลังประมวลผล...";
      chatBox.appendChild(botMsgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      currentController = new AbortController();

      try {
        // 3. ยิง POST ไปที่ Endpoint /api/chat/stream
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            camera_model: cameraSelect.value || null
          }),
          signal: currentController.signal
        });

        if (!response.ok) {
          botMsgDiv.textContent = `เกิดข้อผิดพลาด: HTTP ${response.status}`;
          return;
        }

        // 4. อ่าน Response Body แบบ SSE Buffer
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        let finished = false;
        botMsgDiv.textContent = "";

        // ใช้ flag เพื่อออกจาก while เมื่อเจอ [DONE]
        while (!finished) {
          const { value, done } = await reader.read();
          if (done) break;

          // รองรับ server ที่ส่ง \r\n
          buffer += value.replace(/\r\n/g, "\n");
          const frames = buffer.split("\n\n");
          buffer = frames.pop(); // เก็บ partial frame สุดท้ายไว้ใน buffer

          for (const frame of frames) {
            // อ่านเฉพาะบรรทัด data: (รองรับ frame ที่มี event:/id: นำหน้า)
            const dataLines = frame
              .split("\n")
              .filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).replace(/^ /, ""));
            if (dataLines.length === 0) continue;

            const payload = dataLines.join("\n").trim();
            if (payload === "[DONE]") { finished = true; break; }

            try {
              const parsed = JSON.parse(payload);
              if (parsed.token) {
                botMsgDiv.textContent += parsed.token;
                chatBox.scrollTop = chatBox.scrollHeight;
              } else if (parsed.error) {
                botMsgDiv.textContent += `\n[Stream Error: ${parsed.error}]`;
              }
            } catch (e) {
              console.warn("Bad SSE frame:", payload, e);
            }
          }
        }

        if (finished) reader.cancel().catch(() => {});
      } catch (err) {
        if (err.name !== "AbortError") {
          botMsgDiv.textContent = `เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}`;
        }
      } finally {
        currentController = null;
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>

</body>
</html>
